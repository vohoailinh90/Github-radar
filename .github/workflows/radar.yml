name: Radar scan

on:
  schedule:
    # Wednesday and Saturday at 01:00 UTC = 08:00 in Vietnam (UTC+7). Cron weekdays: 0 = Sunday, so 3 = Wed, 6 = Sat.
    - cron: "0 1 * * 3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover and rank only: no model calls, nothing committed (use this for the first manual run)"
        type: boolean
        default: true
      picks:
        description: "Repositories to cover (blank = radar.yaml)"
        type: string
        default: ""
      langs:
        description: "Content languages, e.g. vi,en,ja (blank = radar.yaml)"
        type: string
        default: ""
      repo:
        description: "Cover this one repository instead of searching: owner/name or a github.com link (blank = the normal scan; picks is then ignored)"
        type: string
        default: ""
      bucket:
        description: "With repo: ai, software, solutions or startup (blank = from the repository's topics)"
        type: string
        default: ""
      preset:
        description: "Saved scan conditions (radar/presets.json, `python3 radar.py presets`). none = radar.yaml as it is. The picks and langs boxes above win over it"
        type: choice
        options: [none, ai-sau, repo-moi-noi, khoi-nghiep-saas, cong-cu-dev, quet-nhanh]
        default: none
      conditions:
        description: "One-off conditions as JSON, e.g. {\"picks_per_run\": 2, \"min_stars\": 3000}. Added to the preset; where both set a value this box wins (see docs/scan-conditions.md)"
        type: string
        default: ""

# One scan at a time; a late run waits instead of cancelling a run that is half-way through its quota.
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    # Same switch as the other repos (docs/vps-team.md): set the repository variable CI_RUNNER to a
    # self-hosted runner label to run on the VPS. Keep this repository PRIVATE if you do.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Doctor (keys)
        if: ${{ env.DRY != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RADAR_LANGS: ${{ inputs.langs }}
        run: python radar.py doctor

      # Informational: a provider's model listing can fail for a minute, and a retired fallback model is not worth a red
      # scheduled run (the gateway falls through to the next model anyway). Read it in the log.
      - name: Doctor (is each model still offered?)
        if: ${{ env.DRY != 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RADAR_LANGS: ${{ inputs.langs }}
        run: python radar.py doctor --ping

      - name: Scan, write, check, export
        id: run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RADAR_PICKS: ${{ inputs.picks }}
          RADAR_LANGS: ${{ inputs.langs }}
          RADAR_REPO: ${{ inputs.repo }}
          RADAR_BUCKET: ${{ inputs.bucket }}
          RADAR_PRESET: ${{ inputs.preset }}
          RADAR_CONDITIONS: ${{ inputs.conditions }}
        run: |
          args=""
          if [ "$DRY" = "true" ]; then args="--dry-run"; fi
          set +e
          python radar.py run $args > run.json
          code=$?
          { echo "### Radar run"; echo '```json'; cat run.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat run.json
          exit $code

      # Runs even when the scan reported a problem: digests that were written are worth keeping,
      # and the job still ends red because the step above failed.
      - name: Commit digests, export and state
        if: ${{ !cancelled() && env.DRY != 'true' }}
        # RADAR_PR_TOKEN (a secret, optional): when it is set the results go to a branch and a pull request instead of a push to
        # main, which is what a protected main needs (docs/branch-protection.md). RADAR_AUTOMERGE=true (a variable) also asks
        # GitHub to merge that pull request once the required checks pass. Neither set: the push to main below, as before.
        env:
          RADAR_PR_TOKEN: ${{ secrets.RADAR_PR_TOKEN }}
          RADAR_AUTOMERGE: ${{ vars.RADAR_AUTOMERGE }}
        run: |
          git config user.name "github-radar"
          git config user.email "radar@users.noreply.github.com"
          # Only the folders that exist: a run that stopped early writes none of them, and `git add` of a missing path is fatal.
          paths=""
          for p in digests export state; do
            if [ -e "$p" ]; then paths="$paths $p"; fi
          done
          if [ -z "$paths" ]; then echo "nothing was written"; exit 0; fi
          git add -- $paths
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "radar: scan $(date -u +%F)"
            if [ -n "$RADAR_PR_TOKEN" ]; then
              # no fallback to a push here: with a token the owner chose pull requests, and a failed publish must be red
              python radar.py publish
            else
              # main may have moved while the scan ran (someone pushed); these folders are bot-only, so rebasing is safe
              git push || { git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; }
            fi
          fi

      - name: Hand off to tool-marketing-studio (draft pull request)
        if: ${{ steps.run.outcome == 'success' && env.DRY != 'true' }}
        env:
          STUDIO_REPO_TOKEN: ${{ secrets.STUDIO_REPO_TOKEN }}
        run: python radar.py handoff
