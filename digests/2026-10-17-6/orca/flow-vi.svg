<svg xmlns="http://www.w3.org/2000/svg" width="1964" height="479" viewBox="0 0 1964 479" role="img" aria-labelledby="t d"><title id="t">Nó chạy như thế nào</title><desc id="d">Orca trên máy tính: Ứng dụng desktop cho macOS, Windows, Linux: gom terminal, worktree, diff, GitHub và Linear.; Git worktree: Mỗi agent làm trong một worktree riêng, không ghi đè mã của agent khác.; CLI agent: Claude Code, Codex, OpenCode, Pi và nhiều agent khác chạy trong terminal của Orca.; Lệnh orca: Viết kịch bản cho Orca: orca worktree create, snapshot, click, fill.; App điện thoại: Theo dõi agent và gửi tiếp yêu cầu từ iOS hoặc Android.; Relay: Ghép app điện thoại với máy desktop; mã nằm trong thư mục cloud/ của repo.</desc><rect width="1964" height="479" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#475569"/></marker></defs><text x="40" y="40" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="40" dy="0">Nó chạy như thế nào</tspan></text><path d="M1132 249 L1148 249 C1180.0 249 1180.0 249 1212 249 L1228 249" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1528 249 L1544 249 C1576.0 249 1576.0 249 1608 249 L1624 249" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M340 166 L356 166 C586.0 166 586.0 249 816 249 L832 249" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M340 332 L356 332 C388.0 332 388.0 332 420 332 L436 332" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><path d="M736 332 L752 332 C784.0 332 784.0 249 816 249 L832 249" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a)"/><rect x="832" y="161" width="300" height="176" rx="14" ry="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="848" y="195" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="848" dy="0">Orca trên máy tính</tspan></text><text x="848" y="221" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="848" dy="0">Ứng dụng desktop cho macOS,</tspan><tspan x="848" dy="23.0">Windows, Linux: gom terminal,</tspan><tspan x="848" dy="23.0">worktree, diff, GitHub và</tspan><tspan x="848" dy="23.0">Linear.</tspan></text><rect x="1228" y="173" width="300" height="153" rx="14" ry="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="1244" y="207" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1244" dy="0">Git worktree</tspan></text><text x="1244" y="233" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="1244" dy="0">Mỗi agent làm trong một</tspan><tspan x="1244" dy="23.0">worktree riêng, không ghi đè</tspan><tspan x="1244" dy="23.0">mã của agent khác.</tspan></text><rect x="1624" y="173" width="300" height="153" rx="14" ry="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="1640" y="207" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="1640" dy="0">CLI agent</tspan></text><text x="1640" y="233" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="1640" dy="0">Claude Code, Codex, OpenCode,</tspan><tspan x="1640" dy="23.0">Pi và nhiều agent khác chạy</tspan><tspan x="1640" dy="23.0">trong terminal của Orca.</tspan></text><rect x="40" y="90" width="300" height="153" rx="14" ry="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="56" y="124" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="56" dy="0">Lệnh orca</tspan></text><text x="56" y="150" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="56" dy="0">Viết kịch bản cho Orca: orca</tspan><tspan x="56" dy="23.0">worktree create, snapshot,</tspan><tspan x="56" dy="23.0">click, fill.</tspan></text><rect x="40" y="267" width="300" height="130" rx="14" ry="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="56" y="301" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="56" dy="0">App điện thoại</tspan></text><text x="56" y="327" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="56" dy="0">Theo dõi agent và gửi tiếp yêu</tspan><tspan x="56" dy="23.0">cầu từ iOS hoặc Android.</tspan></text><rect x="436" y="256" width="300" height="153" rx="14" ry="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="452" y="290" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start"><tspan x="452" dy="0">Relay</tspan></text><text x="452" y="316" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="452" dy="0">Ghép app điện thoại với máy</tspan><tspan x="452" dy="23.0">desktop; mã nằm trong thư mục</tspan><tspan x="452" dy="23.0">cloud/ của repo.</tspan></text></svg>
