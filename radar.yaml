# Cấu hình GitHub Radar. Mọi khóa đều có mặc định trong radar/config.py; chỉ ghi điều muốn đổi.
langs: [vi]            # vi | en | ja. Mỗi ngôn ngữ thêm = một bộ lượt gọi model nữa cho mỗi repo.
picks_per_run: 3       # số repo mỗi lần quét (thứ Tư và thứ Bảy)
min_stars: 1500
max_days_since_push: 120
max_run_minutes: 35   # quá số phút này thì ngừng viết thêm và giữ phần đã xong (job GitHub bị hủy ở phút 60 và mất hết)
pace_seconds: 45       # nghỉ sau mỗi bài. mistral-small-2603 của tài khoản này chỉ 20.000 token/phút: ~1 lượt soát mỗi 60-75 s

# Tên topic là GitHub topic có thật; sửa theo mối quan tâm của bạn. Mỗi bucket được chọn xoay vòng.
buckets:
  - {id: ai, emoji: "🤖", topics: [llm, ai-agents, rag, machine-learning]}
  - {id: software, emoji: "🧰", topics: [developer-tools, self-hosted, cli, productivity]}
  - {id: solutions, emoji: "🧩", topics: [automation, workflow, open-source-alternative, low-code]}
  - {id: startup, emoji: "🚀", topics: [saas, startup, boilerplate, indie-hacker]}

# <provider>/<model>; model đầu là chính, các model sau là dự phòng khi model trước quá tải (503) hoặc treo.
# Người soát luôn được chọn khác họ với model ĐÃ viết bài, nên viết bằng mistral thì soát bằng gemini. Người viết và người soát PHẢI khác họ model.
# Danh sách free đổi liên tục: python3 radar.py models <provider>, rồi python3 radar.py doctor --ping.
models:
  writer: [google/gemini-flash-latest, google/gemini-flash-lite-latest, groq/llama-3.3-70b-versatile, mistral/mistral-small-2603]
  checker: [groq/llama-3.3-70b-versatile, mistral/mistral-small-2603, google/gemini-flash-lite-latest]   # Llama (Groq) khác họ với Gemini; Mistral hiện báo hạn mức 0 nên chỉ là dự phòng

studio:
  tool: github-radar
  name: GitHub Radar
  accent: "#0ea5e9"
