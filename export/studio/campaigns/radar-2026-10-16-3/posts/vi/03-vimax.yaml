slides:
- layout: cover
  emoji: 🤖
  eyebrow: Radar GitHub · AI
  title: Dựng video nhiều cảnh từ một ý tưởng với ViMax
  subtitle: Khung làm việc mã nguồn mở nối kịch bản, phân cảnh, tạo ảnh, tạo video và ghép cuối thành
    một quy trình; có giao diện web, giao diện terminal (TUI) và script…
- layout: stat
  eyebrow: Số liệu theo ngày quét
  value: '12.700'
  label: sao trên GitHub
  caption: MIT · Python
- layout: quote
  text: 'Nhiều công cụ AI chỉ tạo vài giây hình, nhân vật dễ thay đổi giữa các khung và thiếu kịch bản,
    âm thanh, cấu trúc kể chuyện. ViMax điều phối cả chuỗi: viết kịch bản, phân cảnh, tạo nhân vật rồi
    dựng video.'
  author: Vấn đề nó giải quyết
- layout: flow
  variant: after
  title: Nó chạy thế nào
  steps:
  - text: 'Nhận ý tưởng: Bạn nêu ý tưởng, kịch bản hoặc tiểu thuyết; agent lập kế hoạch kể chuyện.'
  - text: 'Lập kịch bản và phân cảnh: Tạo nhân vật, kịch bản, phân cảnh và các cú máy cho từng cảnh.'
  - text: 'Tạo ảnh và video: Điều phối ảnh tham chiếu và khung hình đầu để nhân vật nhất quán, rồi sinh
      các đoạn video.'
  - text: 'Ghép thành video hoàn chỉnh: Các cảnh và cú máy tương thích được tạo song song rồi ghép lại.'
- layout: features
  title: Các mảnh ghép
  items:
  - emoji: 🧩
    title: Giao diện web hoặc TUI
    text: Nơi bạn trò chuyện với agent, sửa kế hoạch và điều khiển việc dựng.
  - emoji: ⚙️
    title: Mô hình chat
    text: Viết kịch bản, phân cảnh; mô hình có thể nhìn ảnh còn dùng để chọn ảnh tốt nhất.
  - emoji: 🔌
    title: Bộ tạo ảnh
    text: Tạo khung hình chính và ảnh tham chiếu để giữ nhân vật nhất quán.
  - emoji: 📦
    title: Bộ tạo video
    text: Biến khung hình thành các đoạn video rồi ghép lại.
- layout: checklist
  title: Học được gì
  tone: ok
  items:
  - 'Chia việc làm phim thành các vai nối tiếp nhau: biên kịch, phân cảnh, tạo ảnh, tạo video, ghép'
  - Giữ nhân vật nhất quán bằng ảnh tham chiếu, khung hình đầu và liên tục máy quay
  - 'Một lõi, nhiều cửa vào: giao diện web, TUI và các script chạy thẳng'
  - 'Tạo nhiều ứng viên song song rồi nhờ mô hình chọn: đổi thêm chi phí lấy chất lượng'
- layout: pains
  title: Lưu ý
  tone: accent
  items:
  - emoji: ⚠️
    text: Cần khóa API cho mô hình chat, mô hình ảnh và mô hình video; chi phí tùy nhà cung cấp, README
      không nêu giá
  - emoji: ⚠️
    text: README chỉ ghi Linux và Windows làm môi trường; macOS không được nhắc đến
  - emoji: ⚠️
    text: Chọn ảnh khung hình chính tạo 2 ứng viên cùng lúc, README ghi cách này có thể làm chi phí API
      cao hơn
  - emoji: ⚠️
    text: README không mô tả từng nút trên giao diện web, nên hướng dẫn chỉ nêu những khả năng README
      liệt kê
- layout: cta
  emoji: 📌
  title: Lưu lại để học dần
  text: Mỗi tuần hai lần có một repo mới.
  show_link: false
