id: 01-voicestudio
status: draft
format: portrait
series: Radar GitHub · 2026-10-13
link: 01-voicestudio
slides:
- layout: cover
  emoji: 🧩
  eyebrow: Radar GitHub · Giải pháp
  title: 'VoiceStudio: Bộ công cụ AI xử lý giọng nói cục bộ đa ngôn ngữ'
  subtitle: VoiceStudio là ứng dụng mã nguồn mở chạy hoàn toàn cục bộ, hỗ trợ nhân bản giọng, thiết kế
    giọng nói, lồng tiếng video và tạo sách nói trong 646 ngôn ngữ.
- layout: stat
  eyebrow: Số liệu theo ngày quét
  value: '62.958'
  label: sao trên GitHub
  caption: AGPL-3.0 · Python
- layout: quote
  text: Nhiều người sáng tạo nội dung và lập trình viên muốn tạo giọng đọc, lồng tiếng hay phiên âm nhưng
    e ngại chi phí dịch vụ đám mây cùng rủi ro lộ dữ liệu âm thanh.
  author: Vấn đề nó giải quyết
- layout: flow
  variant: after
  title: Nó chạy thế nào
  steps:
  - text: 'Nhập dữ liệu âm thanh và văn bản: Người dùng chọn giọng mẫu hoặc tải lên tệp âm thanh tham
      chiếu, sau đó nhập văn bản cần đọc hoặc chọn tệp video cần lồng tiếng.'
  - text: 'Kích hoạt mô hình suy luận: Backend xử lý nạp mô hình tương ứng và điều phối việc tính toán
      đến phần cứng phù hợp để tổng hợp hoặc bóc băng giọng nói.'
  - text: 'Xuất sản phẩm và kết nối agent: Hệ thống tạo ra tệp âm thanh hoàn chỉnh và cho phép điều khiển
      tự động qua giao tiếp Local API hoặc Model Context Protocol.'
- layout: features
  title: Các mảnh ghép
  items:
  - emoji: 🧩
    title: Electron UI
    text: Giao diện máy tính để bàn cung cấp các không gian làm việc cho nhân bản giọng, lồng tiếng và
      quản lý mô hình.
  - emoji: ⚙️
    title: Python Backend
    text: Môi trường chạy xử lý các tác vụ AI, nạp mô hình OmniVoice và điều phối suy luận giọng nói.
  - emoji: 🔌
    title: Hardware Runtime Engine
    text: Lớp tăng tốc phần cứng hỗ trợ NVIDIA CUDA, Apple Silicon MPS hoặc chạy bằng CPU qua PyTorch.
- layout: checklist
  title: Học được gì
  tone: ok
  items:
  - Phân tách kiến trúc rõ ràng giữa giao diện desktop Electron và backend AI bằng Python để dễ bảo trì.
  - Thiết kế cơ chế linh hoạt tận dụng đa dạng phần cứng từ card đồ họa cao cấp đến chỉ chạy trên CPU.
  - Mở rộng ứng dụng desktop truyền thống thành công cụ tự động hóa thông qua giao thức MCP cho các AI
    agent.
- layout: pains
  title: Lưu ý
  tone: accent
  items:
  - emoji: ⚠️
    text: Mã nguồn dùng giấy phép AGPL-3.0, nhưng trọng số mô hình và dữ liệu giọng nói có điều kiện cấp
      phép riêng.
  - emoji: ⚠️
    text: Chạy trên CPU không có card đồ họa sẽ chậm hơn và yêu cầu khoảng 5 GB dung lượng trống để cài
      PyTorch.
  - emoji: ⚠️
    text: Hỗ trợ trên Windows on ARM vẫn ở mức thử nghiệm và backend Python phải chạy qua giả lập x64.
- layout: cta
  emoji: 📌
  title: Lưu lại để học dần
  text: Mỗi tuần hai lần có một repo mới.
  show_link: false
