  items:
  - 'Mô hình Capability Layer: Đóng vai trò chọn lọc, định tuyến và kiểm tra thay vì tự viết lại toàn
    bộ công cụ c…'
  - 'Cơ chế Fallback nhiều tầng: Chuẩn bị sẵn backend thay thế giúp hệ thống tiếp tục chạy khi một công
    cụ bị nền…'
  - 'Bảo mật quyền hạn tối thiểu: Mặc định kiểm tra môi trường không can thiệp file, chỉ thay đổi hệ thống
    khi có…'
- layout: pains
  title: Lưu ý
  tone: accent
  items:
  - emoji: ⚠️
    text: Các nền tảng như Reddit, Twitter hay XiaoHongShu vẫn yêu cầu xuất cookie trình duyệt thủ công
      để truy cập sâu.
  - emoji: ⚠️
    text: Chỉ chạy lệnh cài đặt thực tế khi có cờ --system, mặc định chỉ là bước kiểm tra an toàn.
  - emoji: ⚠️
    text: Môi trường máy chủ có thể cần cấu hình thêm proxy nếu IP bị nền tảng chặn.
