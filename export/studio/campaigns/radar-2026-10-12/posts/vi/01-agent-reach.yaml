  title: Các mảnh ghép
  items:
  - emoji: 🧩
    title: agent-reach CLI
    text: Bộ điều phối quản lý cài đặt, kiểm tra môi trường và định tuyến truy cập cho Agent.
  - emoji: ⚙️
    title: Multi-backend Router
    text: Danh sách công cụ ưu tiên và dự phòng cho từng nền tảng như Jina Reader, yt-dlp, bili-cli.
  - emoji: 🔌
    title: Skill Config
    text: Tập tin cấu hình hướng dẫn Agent nhận diện cú pháp gọi lệnh cho từng nền tảng được kích hoạt.
  - emoji: 📦
    title: Doctor Diagnostic
    text: Mô-đun kiểm tra trạng thái hoạt động và phát hiện lỗi kết nối của các kênh dữ liệu.
- layout: checklist
  title: Học được gì
