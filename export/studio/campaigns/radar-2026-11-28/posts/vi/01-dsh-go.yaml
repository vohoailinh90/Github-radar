    text: Ứng dụng Flutter trên Android cung cấp giao diện trò chuyện, cài đặt môi trường và quản lý kết
      nối.
  - emoji: ⚙️
    title: Runtime Linux
    text: Môi trường Linux chạy bên trong ứng dụng, miễn phí Root và không cần Termux.
